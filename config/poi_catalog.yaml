# Os valores abaixo são termos da taxonomia do Overture Places; são conferidos
# em primary, hierarchy, alternates e basic_category de cada registro.
# Uma categoria local pode reunir mais de um termo da taxonomia.
pharmacy:
  label: Farmácia
  description: Farmácias e drogarias para medicamentos e itens de saúde.
  overture_categories: [pharmacy, drugstore]

hospital:
  label: Hospital
  description: Hospitais para atendimento médico.
  overture_categories: [hospital]

clinic:
  label: Clínica
  description: Clínicas médicas, odontológicas e de outras especialidades.
  overture_categories:
    - primary_care_or_general_clinic
    - pediatric_clinic
    - public_health_clinic
    - behavioral_or_mental_health_clinic
    - vision_or_eye_care_clinic
    - dental_clinic

supermarket:
  label: Supermercado
  description: Supermercados e lojas grandes de alimentos e produtos do dia a dia.
  # A taxonomia desta versão usa grocery_store para supermercados e mercados.
  overture_categories: [grocery_store, superstore]

grocery_store:
  label: Mercearia
  description: Mercados de bairro, mercearias e lojas de conveniência.
  # Há sobreposição com supermarket porque Overture agrupa mercados grandes
  # e pequenos em grocery_store. Mantemos conveniências também neste tipo.
  overture_categories: [grocery_store, convenience_store, organic_grocery_store]

restaurant:
  label: Restaurante
  description: Restaurantes para refeições.
  overture_categories: [restaurant]

cafe:
  label: Café
  description: Cafeterias e locais para café e lanches.
  overture_categories: [cafe]

gym:
  label: Academia
  description: Academias para exercícios físicos.
  overture_categories: [gym]

park:
  label: Parque
  description: Parques e áreas públicas de lazer ao ar livre.
  overture_categories: [park]

school:
  label: Escola
  description: Escolas de ensino básico.
  overture_categories: [school]

# Critérios secundários também são preparados. A IA só deve selecioná-los
# quando a consulta mencionar ou implicar claramente o serviço; o peso final
# continua sendo definido pela importância expressa pela pessoa.
dental_clinic:
  label: Clínica odontológica
  description: Consultórios e clínicas de atendimento odontológico.
  priority: secondary
  overture_categories: [dental_clinic]

